<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#07060b" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Aurelia, a living exhibition of six paintings. Made to be filmed."
    />
    <link rel="preconnect" href="https://fonts.bunny.net" />
    <link
      href="https://fonts.bunny.net/css?family=cormorant-garamond:400,500,600|outfit:300,400"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect fill='%2307060b' width='16' height='16'/%3E%3Ccircle cx='8' cy='8' r='3.2' fill='none' stroke='%23e8c27a' stroke-width='1'/%3E%3Ccircle cx='8' cy='8' r='1' fill='%23f3e2bc'/%3E%3C/svg%3E"
    />
    <title>Aurelia</title>
  </head>
  <body>
    <h1 class="sr-only">Aurelia, a living exhibition</h1>
    <div id="stage" data-room="gilt">
      <canvas id="scene" aria-label="Aurelia, six paintings made of light"></canvas>
      <div class="aurora" aria-hidden="true"></div>
      <div class="rays" aria-hidden="true"></div>
      <div class="grade" aria-hidden="true"></div>
      <div class="spotlight" aria-hidden="true"></div>
      <div class="grain" aria-hidden="true"></div>
      <div class="vignette" aria-hidden="true"></div>
      <div class="scrim" aria-hidden="true"></div>
      <div class="motes" aria-hidden="true"></div>

      <div class="frame" aria-hidden="true">
        <div class="frame-line"></div>
        <div class="frame-inner"></div>
        <div class="frame-sheen"></div>
        <svg class="flourish flourish-nw" viewBox="0 0 160 160">
          <path class="main" d="M10 150 V44 C10 22 26 12 50 12 H150" />
          <path class="thin" d="M10 150 V66 C10 42 32 34 60 34 H150" />
          <path class="thin" d="M50 12 C62 36 48 52 30 58" />
          <path class="thin" d="M36 30 C62 34 74 52 70 78" />
          <circle cx="50" cy="12" r="2.4" />
          <circle cx="30" cy="58" r="1.7" />
          <circle cx="70" cy="78" r="1.5" />
        </svg>
        <svg class="flourish flourish-ne" viewBox="0 0 160 160">
          <path class="main" d="M10 150 V44 C10 22 26 12 50 12 H150" />
          <path class="thin" d="M10 150 V66 C10 42 32 34 60 34 H150" />
          <path class="thin" d="M50 12 C62 36 48 52 30 58" />
          <path class="thin" d="M36 30 C62 34 74 52 70 78" />
          <circle cx="50" cy="12" r="2.4" />
          <circle cx="30" cy="58" r="1.7" />
          <circle cx="70" cy="78" r="1.5" />
        </svg>
        <svg class="flourish flourish-sw" viewBox="0 0 160 160">
          <path class="main" d="M10 150 V44 C10 22 26 12 50 12 H150" />
          <path class="thin" d="M10 150 V66 C10 42 32 34 60 34 H150" />
          <path class="thin" d="M50 12 C62 36 48 52 30 58" />
          <path class="thin" d="M36 30 C62 34 74 52 70 78" />
          <circle cx="50" cy="12" r="2.4" />
          <circle cx="30" cy="58" r="1.7" />
          <circle cx="70" cy="78" r="1.5" />
        </svg>
        <svg class="flourish flourish-se" viewBox="0 0 160 160">
          <path class="main" d="M10 150 V44 C10 22 26 12 50 12 H150" />
          <path class="thin" d="M10 150 V66 C10 42 32 34 60 34 H150" />
          <path class="thin" d="M50 12 C62 36 48 52 30 58" />
          <path class="thin" d="M36 30 C62 34 74 52 70 78" />
          <circle cx="50" cy="12" r="2.4" />
          <circle cx="30" cy="58" r="1.7" />
          <circle cx="70" cy="78" r="1.5" />
        </svg>
      </div>

      <p class="sign">Aurelia</p>

      <footer class="plaque" aria-live="polite">
        <p class="plaque-roman"></p>
        <p class="plaque-title"></p>
        <p class="plaque-line"></p>
        <div class="pager" role="group" aria-label="Rooms"></div>
      </footer>

      <p class="hint">Click to turn the page <span>·</span> F for fullscreen</p>
      <span class="ripple" aria-hidden="true"></span>

      <div class="overture">
        <div class="overture-card">
          <p class="overture-kicker">An exhibition of light</p>
          <p class="overture-title">Aurelia</p>
          <div class="overture-rule"></div>
          <p class="overture-sub">Six rooms, one evening</p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
